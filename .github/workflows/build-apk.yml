name: Build PC ViewPort APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Optional versionName override (e.g. 1.2.0)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      - name: Restore Permanent Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "Error: debug.keystore.base64 not found in repository root."
            exit 1
          fi
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Setup Environment Variables
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Resolve Version Metadata
        id: version
        run: |
          VERSION_CODE="${{ github.run_number }}"
          INPUT_VERSION="${{ github.event.inputs.version_name }}"
          REF_NAME="${{ github.ref_name }}"

          if [ -n "$INPUT_VERSION" ]; then
            VERSION_NAME="$INPUT_VERSION"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_NAME="${REF_NAME#v}"
          else
            VERSION_NAME="1.0.${VERSION_CODE}"
          fi

          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "Resolved PC ViewPort version: v${VERSION_NAME} (code ${VERSION_CODE})"

      - name: Run Unit Tests
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        id: build_apk
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          APK_FILE=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          VERSIONED_NAME="PCViewPort_v${{ steps.version.outputs.version_name }}.apk"
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" "release-assets/${VERSIONED_NAME}"
            echo "apk_path=release-assets/${VERSIONED_NAME}" >> "$GITHUB_OUTPUT"
            echo "apk_name=${VERSIONED_NAME}" >> "$GITHUB_OUTPUT"
            echo "Prepared ${VERSIONED_NAME} from ${APK_FILE}"
          else
            echo "Error: No APK found in app/build/outputs/apk/debug/"
            exit 1
          fi
        id: package_apk

      - name: Publish Direct APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: always() && steps.build_apk.outcome == 'success'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: "PC ViewPort v${{ steps.version.outputs.version_name }} (${{ steps.package_apk.outputs.apk_name }})"
          body: |
            ### PC ViewPort Android Desktop Browser APK
            - **Version**: `v${{ steps.version.outputs.version_name }}` (`versionCode: ${{ steps.version.outputs.version_code }}`)
            - **Direct Download**: Download `${{ steps.package_apk.outputs.apk_name }}` below directly to your device.
            - **Commit**: `${{ github.sha }}`
            - **Build Date**: `${{ github.event.head_commit.timestamp || 'Latest' }}`
          prerelease: false
          make_latest: true
          files: ${{ steps.package_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: PCViewPort-v${{ steps.version.outputs.version_name }}
          path: ${{ steps.package_apk.outputs.apk_path }}
          retention-days: 7
