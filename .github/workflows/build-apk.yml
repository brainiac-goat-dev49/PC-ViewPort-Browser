name: Build PC ViewPort APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Optional versionName override (e.g. 1.2.0)"
        required: false
        default: ""
      upload_artifact:
        description: "Also upload as GitHub Actions artifact (uses artifact storage quota)"
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      - name: Restore Permanent Debug Keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "Restoring debug.keystore from DEBUG_KEYSTORE_BASE64 secret..."
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
          else
            echo "Restoring permanent project debug.keystore..."
            printf '%s' '' | base64 -d > debug.keystore
          fi
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "Alias|SHA1|SHA256" || true

      - name: Setup Environment Variables
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Resolve Version Metadata
        id: version
        run: |
          VERSION_CODE="${{ github.run_number }}"
          INPUT_VERSION="${{ github.event.inputs.version_name }}"
          REF_NAME="${{ github.ref_name }}"

          if [ -n "$INPUT_VERSION" ]; then
            VERSION_NAME="$INPUT_VERSION"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_NAME="${REF_NAME#v}"
          else
            VERSION_NAME="1.0.${VERSION_CODE}"
          fi

          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "Resolved PC ViewPort version: v${VERSION_NAME} (code ${VERSION_CODE})"

      - name: Run Unit Tests
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        id: build_apk
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Align, Sign & Verify APK Asset
        id: package_apk
        run: |
          mkdir -p release-assets
          APK_FILE=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK found in app/build/outputs/apk/debug/"
            exit 1
          fi

          VERSIONED_NAME="PCViewPort_v${{ steps.version.outputs.version_name }}.apk"
          FINAL_APK="release-assets/${VERSIONED_NAME}"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BUILD_TOOLS_DIR=""
          if [ -n "$SDK_ROOT" ] && [ -d "$SDK_ROOT/build-tools" ]; then
            LATEST_BT=$(ls -1 "$SDK_ROOT/build-tools" | sort -V | tail -n 1)
            if [ -n "$LATEST_BT" ]; then
              BUILD_TOOLS_DIR="$SDK_ROOT/build-tools/$LATEST_BT"
            fi
          fi

          if [ -n "$BUILD_TOOLS_DIR" ] && [ -x "$BUILD_TOOLS_DIR/zipalign" ] && [ -x "$BUILD_TOOLS_DIR/apksigner" ]; then
            "$BUILD_TOOLS_DIR/zipalign" -P 16 -f 4 "$APK_FILE" "release-assets/aligned.apk"
            "$BUILD_TOOLS_DIR/apksigner" sign \
              --ks debug.keystore \
              --ks-pass pass:android \
              --ks-key-alias androiddebugkey \
              --key-pass pass:android \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out "$FINAL_APK" \
              "release-assets/aligned.apk"
            rm -f "release-assets/aligned.apk" "${FINAL_APK}.idsig"
            "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$FINAL_APK"
            "$BUILD_TOOLS_DIR/zipalign" -c -P 16 -v 4 "$FINAL_APK" | tail -n 5
          else
            cp "$APK_FILE" "$FINAL_APK"
          fi

          echo "apk_path=${FINAL_APK}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${VERSIONED_NAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared verified APK: ${VERSIONED_NAME} from ${APK_FILE}"

      - name: Publish Direct APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: steps.build_apk.outcome == 'success' && steps.package_apk.outcome == 'success'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: "PC ViewPort v${{ steps.version.outputs.version_name }} (${{ steps.package_apk.outputs.apk_name }})"
          body: |
            ### PC ViewPort Android Desktop Browser APK
            - **Version**: `v${{ steps.version.outputs.version_name }}` (`versionCode: ${{ steps.version.outputs.version_code }}`)
            - **Direct Download**: Download `${{ steps.package_apk.outputs.apk_name }}` below directly to your device.
            - **Commit**: `${{ github.sha }}`
            - **Build Date**: `${{ github.event.head_commit.timestamp || 'Latest' }}`
          prerelease: false
          make_latest: true
          files: ${{ steps.package_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK Artifact
        if: ${{ inputs.upload_artifact == true && steps.package_apk.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: PCViewPort-v${{ steps.version.outputs.version_name }}
          path: ${{ steps.package_apk.outputs.apk_path }}
          retention-days: 7
